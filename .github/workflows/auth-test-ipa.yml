name: Build unsigned AltStore authentication test

on:
  workflow_dispatch:
  push:
    branches: [codex/auth-fix]

permissions:
  contents: read

concurrency:
  group: altstore-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Compile offline regressions and unsigned iOS app
        run: bash Scripts/build_auth_ipa.sh
      - name: Upload unsigned app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AltStore-auth-test
          path: |
            build/AltStore-auth-test.ipa
            build/AltStore-auth-test.ipa.sha256
          retention-days: 3
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log
          path: build-auth.log
          retention-days: 3
          if-no-files-found: ignore
